<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>이석헌 | 웹명함</title>

  <!-- 예비 스타일: HTML만 열어도 디자인이 깨지지 않도록 합니다.

  <style id="webcard-fallback-style">
:root {
  color-scheme: dark;
  --bg: #000000;
  --surface: #14151c;
  --ink: #f2f3f7;
  --muted: #a5aab9;
  --line: #30313e;
  --card-border: #eb89c2;
  --accent-color: #eb89c2;
  --accent-soft: #33232e;
}

/* ==================================
   기본 초기화
================================== */

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 24px;
  display: grid;
  place-items: center;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", "Noto Sans KR", sans-serif;
  color: var(--ink);
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--accent-color);
  outline-offset: 3px;
}

/* ==================================
   전체 레이아웃
================================== */

.layout {
  width: min(100%, 440px);
}

.card {
  /* 버튼 바깥으로 퍼지는 네온 그림자가 잘리지 않도록 합니다. */
  overflow: visible;
  border: 1px solid var(--card-border);
  border-radius: 24px;
  background: var(--surface);
  box-shadow:
    0 24px 70px rgba(0, 0, 0, .6),
    0 0 30px rgba(235, 137, 194, .08);
}

/* ==================================
   헤더
================================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 28px 28px 0;
}

.brand {
  font-size: 16px;
  font-weight: 850;
  letter-spacing: -.05em;
}

.eyebrow {
  color: #adb0be;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .11em;
}

/* ==================================
   프로필
================================== */

.profile {
  padding: 35px 24px 29px;
  text-align: center;
}

.avatar-wrap {
  position: relative;
  width: 124px;
  height: 124px;
  margin: 0 auto 24px;
}

.avatar {
  width: 124px;
  height: 124px;
  display: block;
  border: 5px solid var(--surface);
  border-radius: 50%;
  object-fit: cover;
  background: #2c303c;
  box-shadow:
    0 6px 25px rgba(0, 0, 0, .36);
}

.avatar-fallback {
  display: grid;
  place-items: center;
  color: #bfc3d2;
  font-size: 38px;
  font-weight: 750;
}

/* 프로필 이미지 변경 버튼 */

.camera {
  position: absolute;
  bottom: 0;
  right: -3px;
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  border: 3px solid var(--surface);
  border-radius: 50%;
  background: #383044;
  color: var(--ink);
  font-size: 23px;
  line-height: 1;
}

.camera:hover {
  background: var(--accent-color);
}

/* 이름 */

.name {
  margin: 0;
  font-size: calc(30px + 1pt);
  font-weight: 850;
  letter-spacing: -.06em;
}

/* 직업 */

.job {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 15px;
}

/* 핑크 포인트 라인 */

.accent {
  width: 30px;
  height: 3px;
  margin: 26px auto 0;
  border-radius: 4px;
  background: var(--accent-color);
}

/* ==================================
   연락처
================================== */

.contacts {
  border-top: 1px solid var(--line);
  padding: 13px 28px;
}

.contact {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  padding: 16px 0;
  color: inherit;
  text-decoration: none;
}

.contact + .contact {
  border-top: 1px solid var(--line);
}

.contact:hover .value {
  color: var(--accent-color);
}

/* 연락처 아이콘 */

.symbol {
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  border-radius: 13px;
  color: var(--accent-color);
}

.symbol svg {
  width: 21px;
  height: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.contact-text {
  flex: 1;
  min-width: 0;
}

.label {
  display: block;
  color: #a7adbe;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .08em;
  margin-bottom: 5px;
}

.value {
  display: block;
  font-size: 15px;
  font-weight: 650;
  overflow-wrap: anywhere;
}

.arrow {
  color: #9297aa;
  font-size: 22px;
}

/* ==================================
   이메일 복사 / 전화하기 버튼
================================== */

.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 19px 28px 29px;
}

.quick-action {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  min-width: 0;
  min-height: 51px;

  padding: 12px;

  border: 1px solid var(--accent-color);
  border-radius: 13px;

  font-size: 14px;
  font-weight: 750;
  line-height: 1.4;
  text-align: center;
  text-decoration: none;

  cursor: pointer;

  box-shadow:
    0 4px 14px rgba(0, 0, 0, .22);

  transition:
    transform .22s ease,
    box-shadow .25s ease,
    background-color .25s ease,
    color .25s ease,
    border-color .25s ease;
}

/* 이메일 복사 버튼 */

.quick-action--email {
  background: var(--accent-color);
  color: #14151c;
}

/* 전화하기 버튼 */

.quick-action--phone {
  background: #1c1d26;
  color: var(--accent-color);
}

/* ==================================
   버튼 주변 핑크 네온 효과
   흐릿한 빛과 외부 그림자를 조합합니다.
================================== */

.quick-action {
  isolation: isolate;
  /* 기본 상태에서도 극히 약한 빛 */
  box-shadow: 0 3px 10px rgba(0, 0, 0, .25);
}

/* 빛이 버튼 가장자리 바깥으로 자연스럽게 번집니다. */
.quick-action::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 16px;
  background: rgba(235, 137, 194, .4);
  filter: blur(12px);
  opacity: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity .3s ease;
}

/* 안쪽 조명은 버튼 텍스트를 가리지 않습니다. */
.quick-action::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(
    ellipse at 50% 100%,
    rgba(255, 255, 255, .2),
    transparent 70%
  );
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}

@media (hover: hover) {
  .quick-action:hover {
    transform: translateY(-3px);
    box-shadow:
      0 0 12px rgba(235, 137, 194, .55),
      0 0 26px rgba(235, 137, 194, .28),
      0 8px 20px rgba(0, 0, 0, .3);
  }

  .quick-action:hover::before { opacity: .45; }
  .quick-action:hover::after { opacity: .45; }

  .quick-action--email:hover { background: #ef9bcc; }
  .quick-action--phone:hover {
    background: #27212b;
    color: #f3a9d1;
  }
}

/* 클릭 후 JS에서 1초 동안 클래스를 유지합니다. */
.quick-action.is-glowing,
.quick-action:active {
  transform: translateY(-2px) scale(.99);
  box-shadow:
    0 0 12px rgba(235, 137, 194, .8),
    0 0 28px rgba(235, 137, 194, .48),
    0 0 45px rgba(235, 137, 194, .24),
    0 8px 20px rgba(0, 0, 0, .3);
}

.quick-action.is-glowing::before,
.quick-action:active::before { opacity: .8; }

.quick-action.is-glowing::after,
.quick-action:active::after { opacity: 1; }

.quick-action:focus-visible {
  outline: 2px solid var(--accent-color);
  outline-offset: 3px;
}

/* ==================================
   기존 하단 버튼
   연락처 저장 / 명함 공유
================================== */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 15px 28px 29px;
}

.btn {
  min-height: 51px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #1c1d26;
  color: var(--ink);
  font-size: 14px;
  font-weight: 750;

  transition:
    background .15s,
    transform .15s;
}

.btn:hover {
  transform: translateY(-1px);
  background: #2a2631;
}

.btn-primary {
  color: #20151d;
  background: var(--accent-color);
  border-color: var(--accent-color);
}

.btn-primary:hover {
  background: #f3a9d1;
}

/* ==================================
   하단 안내 문구 및 초기화
================================== */

.below {
  margin: 18px auto 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.reset {
  margin-top: 6px;
  padding: 3px 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  text-decoration: underline;
}

/* ==================================
   알림 메시지
================================== */

.toast {
  position: fixed;
  left: 50%;
  bottom: 25px;

  max-width: calc(100vw - 32px);

  transform: translate(-50%, 12px);

  padding: 12px 17px;

  border-radius: 12px;
  background: #25232c;
  color: var(--ink);
  border: 1px solid var(--card-border);

  font-size: 13px;
  opacity: 0;
  visibility: hidden;

  transition: .2s ease;

  text-align: center;
  z-index: 5;
}

.toast.visible {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

/* ==================================
   모바일 반응형
================================== */

@media (max-width: 480px) {

  body {
    padding: 15px;
  }

  .card {
    border-radius: 20px;
  }

  .header {
    padding: 24px 23px 0;
  }

  .profile {
    padding: 34px 20px 27px;
  }

  .contacts {
    padding: 12px 23px;
  }

  .actions {
    padding: 15px 23px 25px;
  }

  .quick-actions {
    padding: 19px 23px 25px;
  }

  .name {
    font-size: calc(28px + 1pt);
  }
}

/* ==================================
   작은 모바일 화면
================================== */

@media (max-width: 340px) {

  .actions,
  .quick-actions {
    grid-template-columns: 1fr;
  }
}

/* ==================================
   접근성: 움직임 최소화
================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    transition: none !important;
  }

  .quick-action:hover,
  .quick-action:active,
  .quick-action.is-glowing {
    transform: none;
  }
}


/* ==================================
   실제 하단 버튼 2개의 핑크 네온 효과
   기존 .btn 크기/색상/배치 유지
================================== */
.actions .btn {
  transition: background .15s ease, transform .15s ease, box-shadow .25s ease;
}

@media (hover: hover) {
  .actions .btn:hover {
    box-shadow:
      0 0 12px rgba(235, 137, 194, .55),
      0 0 26px rgba(235, 137, 194, .28),
      0 8px 20px rgba(0, 0, 0, .3);
  }
}

.actions .btn.is-glowing,
.actions .btn:active {
  box-shadow:
    0 0 12px rgba(235, 137, 194, .8),
    0 0 28px rgba(235, 137, 194, .48),
    0 0 45px rgba(235, 137, 194, .24);
}

@media (prefers-reduced-motion: reduce) {
  .actions .btn { transition: none; }
  .actions .btn.is-glowing { transform: none; }
}

/* ==================================
   GitHub 버튼: 기존 두 버튼 바로 아래 전체 너비
   기존 .btn 디자인/네온 효과와 독립적으로 적용
================================== */
.actions .github-action {
  grid-column: 1 / -1;
  min-width: 0;
  min-height: 51px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 16px;
  border: 1px solid var(--accent-color);
  border-radius: 13px;
  background: #1c1d26;
  color: var(--accent-color);
  font-size: 14px;
  font-weight: 750;
  line-height: 1.4;
  text-decoration: none;
  text-align: center;
  transition: background-color .2s ease, box-shadow .25s ease, transform .2s ease;
}

@media (hover: hover) {
  .actions .github-action:hover {
    background: #27212b;
    transform: translateY(-2px);
    box-shadow:
      0 0 12px rgba(235, 137, 194, .55),
      0 0 26px rgba(235, 137, 194, .28);
  }
}

.actions .github-action:active {
  box-shadow:
    0 0 12px rgba(235, 137, 194, .8),
    0 0 28px rgba(235, 137, 194, .48);
}

@media (prefers-reduced-motion: reduce) {
  .actions .github-action { transition: none; }
  .actions .github-action:hover { transform: none; }
}
