
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>이석헌 | 웹명함</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --surface: #14151c;
      --ink: #f2f3f7b;
      --muted: #a5aab9;
      --line: #30313e;
      --blue: #2563eb;
      --soft-blue: #eef5ff;
      --card-border: #eb89c2;
      --accent-color: #eb89c2;
      --accent-soft: #33232e;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans KR", sans-serif;
      color: var(--ink);
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    .layout {
      width: min(100%, 440px);
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: var(--surface);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .6),
      0 0 30px rgba(235, 137, 194, .08);
    }

    /* 헤더 */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 28px 28px 0;
    }

    .brand {
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.05em;
    }

    .eyebrow {
      color: #91a0b7;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .11em;
    }

    /* 프로필 */

    .profile {
      padding: 35px 24px 29px;
      text-align: center;
    }

    .avatar-wrap {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto 24px;
    }

    .avatar {
      width: 124px;
      height: 124px;
      display: block;
      border: 5px solid white;
      border-radius: 50%;
      object-fit: cover;
      background: #e4eaf2;
      box-shadow: 0 6px 25px rgba(24, 42, 71, .11);
    }

    .avatar-fallback {
      display: grid;
      place-items: center;
      color: #667891;
      font-size: 38px;
      font-weight: 750;
    }

    .camera {
      position: absolute;
      bottom: 0;
      right: -3px;
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border: 3px solid white;
      border-radius: 50%;
      background: var(--ink);
      color: white;
      font-size: 23px;
      line-height: 1;
    }

    .camera:hover {
      background: var(--blue);
    }

    .name {
      margin: 0;
      font-size: calc(30px + 1pt);
      font-weight: 850;
      letter-spacing: -.06em;
    }

    .job {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .accent {
      width: 30px;
      height: 3px;
      margin: 26px auto 0;
      border-radius: 4px;
      background: var(--blue);
    }

    /* 연락처 */

    .contacts {
      border-top: 1px solid var(--line);
      padding: 13px 28px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      padding: 16px 0;
      color: inherit;
      text-decoration: none;
    }

    .contact + .contact {
      border-top: 1px solid #f0f3f7;
    }

    .contact:hover .value {
      color: var(--blue);
    }

    .symbol {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: var(--soft-blue);
      border-radius: 13px;
      color: var(--blue);
    }

    .symbol svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-text {
      flex: 1;
      min-width: 0;
    }

    .label {
      display: block;
      color: #97a5ba;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 5px;
    }

    .value {
      display: block;
      font-size: 15px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .arrow {
      color: #a7b4c6;
      font-size: 22px;
    }

    /* 하단 버튼 */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 15px 28px 29px;
    }

    .btn {
      min-height: 51px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fff;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      transition: background .15s, transform .15s;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: #f9fbfe;
    }

    .btn-primary {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .btn-primary:hover {
      background: #2b405f;
    }

    .below {
      margin: 18px auto 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .reset {
      margin-top: 6px;
      padding: 3px 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
    }

    /* 알림 */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      max-width: calc(100vw - 32px);
      transform: translate(-50%, 12px);
      padding: 12px 17px;
      border-radius: 12px;
      background: var(--ink);
      color: white;
      font-size: 13px;
      opacity: 0;
      visibility: hidden;
      transition: .2s ease;
      text-align: center;
      z-index: 5;
    }

    .toast.visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    /* 모바일 반응형 */

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        border-radius: 20px;
      }

      .header {
        padding: 24px 23px 0;
      }

      .profile {
        padding: 34px 20px 27px;
      }

      .contacts {
        padding: 12px 23px;
      }

      .actions {
        padding: 15px 23px 25px;
      }

      .name {
        font-size:  calc(28px + 1pt);
      }
    }

    @media (max-width: 340px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="layout">

    <article class="card" aria-label="디지털 명함">

      <!-- 상단 헤더 -->
      <header class="header">
        <span class="brand">My Card.</span>
        <span class="eyebrow">DIGITAL BUSINESS CARD</span>
      </header>

      <!-- 프로필 영역 -->
      <section class="profile" aria-label="프로필">

        <div class="avatar-wrap">

          <!-- cat1 이미지 표시 -->
          <img
            id="avatar"
            class="avatar"
            alt="프로필 사진"
            hidden
          >

          <!-- 이미지를 찾지 못했을 때 -->
          <div
            id="avatarFallback"
            class="avatar avatar-fallback"
            aria-hidden="true"
          >이</div>

          <!-- 이미지 변경 버튼 -->
          <button
            id="uploadButton"
            class="camera"
            type="button"
            aria-label="프로필 이미지 변경"
            title="프로필 이미지 변경"
          >+</button>

          <input
            id="imageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            hidden
          >

        </div>

        <h1 id="name" class="name"></h1>
        <p id="job" class="job"></p>

        <div class="accent" aria-hidden="true"></div>

      </section>

      <!-- 이메일 및 전화번호 -->
      <section class="contacts" aria-label="연락처">

        <a id="emailLink" class="contact" href="#">
          <span class="symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>

          <span class="contact-text">
            <span class="label">EMAIL</span>
            <span id="email" class="value"></span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a id="phoneLink" class="contact" href="#">
          <span class="symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6.6 3h3L11 8l-2.2 2.3a16.5 16.5 0 0 0 5 5L16 13l5 1.4v3A3.6 3.6 0 0 1 17.4 21 14.4 14.4 0 0 1 3 6.6 3.6 3.6 0 0 1 6.6 3Z"/>
            </svg>
          </span>

          <span class="contact-text">
            <span class="label">PHONE</span>
            <span id="phone" class="value"></span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

      </section>

      <!-- 기능 버튼 -->
      <div class="actions">
        <button
          id="saveContact"
          class="btn btn-primary"
          type="button"
        >연락처 저장</button>

        <button
          id="shareCard"
          class="btn"
          type="button"
        >명함 공유</button>
      </div>

    </article>

    <div class="below">
      + 버튼으로 프로필 사진을 변경할 수 있습니다.
      <div>
        <button
          id="resetImage"
          class="reset"
          type="button"
          hidden
        >기본 이미지(cat1)로 복원</button>
      </div>
    </div>

  </main>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script>
    "use strict";

    /*
    ============================================
      1. 사용자 정보 설정
    ============================================
    */

    const PROFILE = Object.freeze({
      name: "이석헌",
      job: "Full Stack Developer",
      email: "hello@example.com",
      phone: "010-1234-5678"
    });

    /*
    ============================================
      2. 기본 프로필 이미지 설정

      HTML 파일과 같은 폴더에
      cat1.jpg 파일을 넣어주세요.

      JPG, JPEG, PNG, WEBP 지원
    ============================================
    */

    const DEFAULT_IMAGES = [
      "./cat1.jpg",
      "./cat1.jpeg",
      "./cat1.png",
      "./cat1.webp"
    ];

    const STORAGE_KEY = "webcard_custom_avatar_v1";

    const $ = (id) => document.getElementById(id);

    let toastTimer;
    let imageLoadSequence = 0;

    /*
    ============================================
      3. 알림 메시지
    ============================================
    */

    function toast(message) {
      const el = $("toast");

      el.textContent = message;
      el.classList.add("visible");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        el.classList.remove("visible");
      }, 2600);
    }

    /*
    ============================================
      4. 브라우저에 저장된 이미지 가져오기
    ============================================
    */

    function getCustomImage() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch {
        return null;
      }
    }

    /*
    ============================================
      5. 프로필 이미지 처리
    ============================================
    */

    function showFallback() {
      $("avatar").hidden = true;
      $("avatarFallback").hidden = false;
    }

    function showImage(src) {
      $("avatar").src = src;
      $("avatar").hidden = false;
      $("avatarFallback").hidden = true;
    }

    /*
      cat1.jpg부터 차례대로 확인합니다.

      파일을 찾지 못하면
      다음 확장자로 자동 검색합니다.
    */

    function loadAvatar() {
      const seq = ++imageLoadSequence;

      const custom = getCustomImage();

      const candidates = custom
        ? [custom, ...DEFAULT_IMAGES]
        : DEFAULT_IMAGES;

      $("resetImage").hidden = !custom;

      showFallback();

      function tryNext(index) {
        if (seq !== imageLoadSequence) return;

        if (index >= candidates.length) {
          showFallback();

          console.warn(
            "프로필 이미지를 찾지 못했습니다. " +
            "cat1.jpg 파일 위치를 확인하세요."
          );

          return;
        }

        const test = new Image();

        test.onload = () => {
          if (seq === imageLoadSequence) {
            showImage(candidates[index]);
          }
        };

        test.onerror = () => {
          tryNext(index + 1);
        };

        test.src = candidates[index];
      }

      tryNext(0);
    }

    /*
    ============================================
      6. 사용자 정보 화면 표시
    ============================================
    */

    function render() {
      $("name").textContent = PROFILE.name;
      $("job").textContent = PROFILE.job;
      $("email").textContent = PROFILE.email;
      $("phone").textContent = PROFILE.phone;

      $("emailLink").href = `mailto:${PROFILE.email}`;

      $("phoneLink").href =
        `tel:${PROFILE.phone.replace(/[^\d+]/g, "")}`;

      $("avatarFallback").textContent =
        Array.from(PROFILE.name.trim())[0] || "?";

      document.title = `${PROFILE.name} | 웹명함`;

      loadAvatar();
    }

    /*
    ============================================
      7. 업로드 이미지 최적화
    ============================================
    */

    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = () => {
          reject(new Error("파일을 읽을 수 없습니다."));
        };

        reader.onload = () => {
          const image = new Image();

          image.onerror = () => {
            reject(
              new Error("이미지 형식이 올바르지 않습니다.")
            );
          };

          image.onload = () => {
            try {
              const scale = Math.min(
                1,
                640 / Math.max(
                  image.naturalWidth,
                  image.naturalHeight
                )
              );

              const canvas =
                document.createElement("canvas");

              canvas.width = Math.max(
                1,
                Math.round(image.naturalWidth * scale)
              );

              canvas.height = Math.max(
                1,
                Math.round(image.naturalHeight * scale)
              );

              const ctx = canvas.getContext("2d");

              if (!ctx) {
                throw new Error("캔버스 생성 실패");
              }

              ctx.fillStyle = "#ffffff";

              ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
              );

              ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
              );

              resolve(
                canvas.toDataURL("image/jpeg", 0.8)
              );

            } catch (error) {
              reject(error);
            }
          };

          image.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }

    /*
    ============================================
      8. 프로필 이미지 업로드
    ============================================
    */

    $("uploadButton").addEventListener("click", () => {
      $("imageInput").click();
    });

    $("imageInput").addEventListener(
      "change",
      async (event) => {

        const file = event.target.files?.[0];

        event.target.value = "";

        if (!file) return;

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp"
        ];

        if (!allowedTypes.includes(file.type)) {
          toast(
            "JPG, PNG, WEBP 이미지만 업로드할 수 있습니다."
          );
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          toast(
            "10MB 이하의 이미지를 선택해 주세요."
          );
          return;
        }

        try {
          const image = await resizeImage(file);

          try {
            localStorage.setItem(
              STORAGE_KEY,
              image
            );

            loadAvatar();

            toast(
              "프로필 이미지가 이 브라우저에 저장되었습니다."
            );

          } catch {
            ++imageLoadSequence;

            showImage(image);

            toast(
              "사진은 변경됐지만 브라우저에 저장하지 못했습니다."
            );
          }

        } catch {
          toast(
            "이미지를 처리하지 못했습니다."
          );
        }
      }
    );

    /*
    ============================================
      9. 기본 이미지로 복원
    ============================================
    */

    $("resetImage").addEventListener("click", () => {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch {
        toast(
          "저장된 이미지를 삭제하지 못했습니다."
        );
        return;
      }

      loadAvatar();

      toast(
        "기본 이미지(cat1)로 복원했습니다."
      );
    });

    /*
    ============================================
      10. VCard 문자열 처리
    ============================================
    */

    function escapeVCard(text) {
      return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/\r\n|\r|\n/g, "\\n")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,");
    }

    /*
    ============================================
      11. 연락처 저장
    ============================================
    */

    $("saveContact").addEventListener(
      "click",
      () => {

        const phone =
          PROFILE.phone.replace(/[^\d+]/g, "");

        const card = [
          "BEGIN:VCARD",
          "VERSION:3.0",
          `FN:${escapeVCard(PROFILE.name)}`,
          `N:;${escapeVCard(PROFILE.name)};;;`,
          `TITLE:${escapeVCard(PROFILE.job)}`,
          `EMAIL;TYPE=INTERNET:${escapeVCard(PROFILE.email)}`,
          `TEL;TYPE=CELL:${phone}`,
          "END:VCARD"
        ].join("\r\n") + "\r\n";

        const blob = new Blob(
          ["\ufeff", card],
          {
            type: "text/vcard;charset=utf-8"
          }
        );

        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;

        a.download =
          `${PROFILE.name.replace(/[\\/:*?"<>|]/g, "_") || "contact"}.vcf`;

        document.body.appendChild(a);

        a.click();
        a.remove();

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 2000);

        toast(
          "연락처 파일을 저장했습니다."
        );
      }
    );

    /*
    ============================================
      12. 클립보드 복사
    ============================================
    */

    async function copyText(value) {
      if (
        navigator.clipboard &&
        window.isSecureContext
      ) {
        await navigator.clipboard.writeText(value);

        return true;
      }

      const temp =
        document.createElement("textarea");

      temp.value = value;
      temp.style.position = "fixed";
      temp.style.opacity = "0";

      document.body.appendChild(temp);

      temp.select();

      let ok = false;

      try {
        ok = document.execCommand("copy");
      } finally {
        temp.remove();
      }

      return ok;
    }

    /*
    ============================================
      13. 명함 공유
    ============================================
    */

    $("shareCard").addEventListener(
      "click",
      async () => {

        const info = [
          `${PROFILE.name} | ${PROFILE.job}`,
          `이메일: ${PROFILE.email}`,
          `전화번호: ${PROFILE.phone}`
        ].join("\n");

        const hosted =
          /^https?:$/.test(location.protocol);

        const shareData = {
          title: `${PROFILE.name} 웹명함`,
          text: info
        };

        if (hosted) {
          shareData.url = location.href;
        }

        try {
          if (navigator.share) {
            await navigator.share(shareData);

          } else {
            const content = hosted
              ? `${info}\n${location.href}`
              : info;

            const copied =
              await copyText(content);

            toast(
              copied
                ? "명함 정보를 복사했습니다."
                : "클립보드 복사를 지원하지 않습니다."
            );
          }

        } catch (error) {

          if (error?.name !== "AbortError") {

            const content = hosted
              ? `${info}\n${location.href}`
              : info;

            try {
              const copied =
                await copyText(content);

              toast(
                copied
                  ? "명함 정보를 복사했습니다."
                  : "명함 공유에 실패했습니다."
              );

            } catch {
              toast(
                "명함 공유에 실패했습니다."
              );
            }
          }
        }
      }
    );

    /*
    ============================================
      14. 초기 실행
    ============================================
    */

    render();

  </script>

</body>
</html>
