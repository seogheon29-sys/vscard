
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>이석헌 | 웹명함</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="layout">

    <article class="card" aria-label="디지털 명함">

      <!-- 상단 헤더 -->
      <header class="header">
        <span class="brand">My Card.</span>
        <span class="eyebrow">DIGITAL BUSINESS CARD</span>
      </header>

      <!-- 프로필 영역 -->
      <section class="profile" aria-label="프로필">

        <div class="avatar-wrap">

          <!-- cat1 이미지 표시 -->
          <img
            id="avatar"
            class="avatar"
            alt="프로필 사진"
            hidden
          >

          <!-- 이미지를 찾지 못했을 때 -->
          <div
            id="avatarFallback"
            class="avatar avatar-fallback"
            aria-hidden="true"
          >이</div>

          <!-- 이미지 변경 버튼 -->
          <button
            id="uploadButton"
            class="camera"
            type="button"
            aria-label="프로필 이미지 변경"
            title="프로필 이미지 변경"
          >+</button>

          <input
            id="imageInput"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            hidden
          >

        </div>

        <h1 id="name" class="name"></h1>
        <p id="job" class="job"></p>

        <div class="accent" aria-hidden="true"></div>

      </section>

      <!-- 이메일 및 전화번호 -->
      <section class="contacts" aria-label="연락처">

        <a id="emailLink" class="contact" href="#">
          <span class="symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"/>
              <path d="m3 7 9 6 9-6"/>
            </svg>
          </span>

          <span class="contact-text">
            <span class="label">EMAIL</span>
            <span id="email" class="value"></span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

        <a id="phoneLink" class="contact" href="#">
          <span class="symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M6.6 3h3L11 8l-2.2 2.3a16.5 16.5 0 0 0 5 5L16 13l5 1.4v3A3.6 3.6 0 0 1 17.4 21 14.4 14.4 0 0 1 3 6.6 3.6 3.6 0 0 1 6.6 3Z"/>
            </svg>
          </span>

          <span class="contact-text">
            <span class="label">PHONE</span>
            <span id="phone" class="value"></span>
          </span>

          <span class="arrow" aria-hidden="true">›</span>
        </a>

      </section>

      <!-- 기능 버튼 -->
      <div class="actions">
        <button
          id="saveContact"
          class="btn btn-primary"
          type="button"
        >연락처 저장</button>

        <button
          id="shareCard"
          class="btn"
          type="button"
        >명함 공유</button>
      </div>

    </article>

    <div class="below">
      + 버튼으로 프로필 사진을 변경할 수 있습니다.
      <div>
        <button
          id="resetImage"
          class="reset"
          type="button"
          hidden
        >기본 이미지(cat1)로 복원</button>
      </div>
    </div>

  </main>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


<script
 src="script.js"></script>
</body>
</html>
